# QuickBoot display module preload list — generic fallback (intentionally empty).
#
# The active list is machine-specific and lives in files/<machine>/display-modules.conf.
# BitBake's FILESPATH resolves file://display-modules.conf to files/<machine>/ first
# and falls back to this generic copy. An empty list means "no display module preload
# on this machine"; add files/<machine>/display-modules.conf to enable it for a target.
