# QuickBoot camera module preload list — generic fallback (intentionally empty).
#
# The active list is machine-specific and lives in files/<machine>/camera-modules.conf.
# BitBake's FILESPATH resolves file://camera-modules.conf to files/<machine>/ first
# and falls back to this generic copy. An empty list means "no camera module preload
# on this machine"; add files/<machine>/camera-modules.conf to enable it for a target.
