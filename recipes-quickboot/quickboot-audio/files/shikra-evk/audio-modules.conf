# Shikra EVK audio modules.
#
# The shikra-evk MACHINE supports CQM, CQS, and IQS DTBs.  The codec path is
# selected by the DTB, so keep the modules for the three supported paths here:
# CQM uses QAIF and RX/VA macros, CQM/CQS use WSA885x, and IQS uses MAX98090.

snd_soc_qcom_qaif
snd_soc_lpass_rx_macro
snd_soc_lpass_va_macro
snd_soc_wsa885x_i2c
snd_soc_max98090
