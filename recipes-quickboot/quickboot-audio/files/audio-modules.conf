# QuickBoot audio module preload list — generic fallback (intentionally empty).
#
# The active list is machine-specific and lives in files/<machine>/audio-modules.conf.
# BitBake's FILESPATH resolves file://audio-modules.conf to files/<machine>/ first
# and falls back to this generic copy. An empty list means "no audio module preload
# on this machine"; add files/<machine>/audio-modules.conf to enable it for a target.
